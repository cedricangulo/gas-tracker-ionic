<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button
      tab="home"
      aria-label="Home"
      routerLink="/home"
      routerLinkActive="route-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      ><ion-icon name="home-outline" aria-hidden="true" /><ion-label
        >Home</ion-label
      ></ion-tab-button
    >
    <ion-tab-button
      tab="charts"
      aria-label="Charts"
      routerLink="/charts"
      routerLinkActive="route-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      ><ion-icon name="bar-chart-outline" aria-hidden="true" /><ion-label
        >Charts</ion-label
      ></ion-tab-button
    >
    <ion-tab-button
      tab="log"
      aria-label="Log"
      routerLink="/log"
      routerLinkActive="route-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      ><ion-icon name="receipt-outline" aria-hidden="true" /><ion-label
        >Log</ion-label
      ></ion-tab-button
    >
    <ion-tab-button
      tab="map"
      aria-label="Map"
      routerLink="/map"
      routerLinkActive="route-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      ><ion-icon name="map-outline" aria-hidden="true" /><ion-label>Map</ion-label></ion-tab-button
    >
    <ion-tab-button
      tab="settings"
      aria-label="Settings"
      routerLink="/settings"
      routerLinkActive="route-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      ><ion-icon name="settings-outline" aria-hidden="true" /><ion-label
        >Settings</ion-label
      ></ion-tab-button
    >
  </ion-tab-bar>
</ion-tabs>
<a class="add-fab" routerLink="/fillup/new" aria-label="Add fill-up"
  ><ion-icon name="add-outline" aria-hidden="true"
/></a>
