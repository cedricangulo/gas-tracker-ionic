<VirtualHost *:${PORT}>
    DocumentRoot /var/www/public
    ServerName localhost

    # TLS ends at Railway's proxy; tell PHP the original request was HTTPS.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    Alias /api /var/www/app/api
    <Directory /var/www/app/api>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Only the endpoints are reachable; helper/config files are not.
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
        <FilesMatch "^(auth|fillups|settings)\.php$">
            Require all granted
        </FilesMatch>
    </Directory>

    <Directory /var/www/public>
        Options -Indexes
        Require all granted
    </Directory>

    # Everything else in the app tree (config, sql, vendor, tests) stays private.
    <Directory /var/www/app>
        Require all denied
    </Directory>
    <Directory /var/www/app/api>
        Require all granted
    </Directory>
    <FilesMatch "^(\.|config).*">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(auth|fillups|settings)\.php$">
        Require all granted
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
